name: Atualiza agenda semanal

# Roda toda quinta às 12:00 UTC (= 9h em Salvador/Bahia). Também dá pra
# disparar na mão pela aba "Actions" do GitHub (botão "Run workflow").
# Autenticação pela ASSINATURA do Claude (Pro ou Max) — NÃO precisa de conta
# de API paga. O token vem do secret CLAUDE_CODE_OAUTH_TOKEN.
on:
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write   # deixa o Claude publicar (git commit + push) no próprio repo

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Atualizar a agenda com o Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 25'
          prompt: |
            Você vai atualizar a agenda cultural de Salvador no arquivo index.html deste repositório.

            1) Descubra a data de hoje em Salvador (fuso America/Bahia), no formato AAAA-MM-DD.

            2) Pesquise na web (use WebSearch/WebFetch) a programação cultural REAL e ATUAL de Salvador
               dos próximos 12 dias a partir de hoje: shows, teatro, dança, exposições, festas e feiras.
               IMPORTANTíSSIMO: use SOMENTE informação do ano atual — ignore páginas e eventos de anos
               anteriores. Se a data não for claramente do ano atual, descarte.
               Use APENAS estas fontes: el Cabong (elcabong.com.br), Roda Cultural, Roteiro Cultural SSA
               (roteiroculturalssa.com.br), Sympla (sympla.com.br), Pixta, Eventim, Shotgun (shotgun.live)
               e o site da Prefeitura de Salvador (salvador.ba.gov.br / culturatododia / Pelourinho Dia e Noite).

            3) Edite APENAS DUAS coisas no index.html, sem tocar em mais nada:
               (a) A linha que começa com  const HOJE_ISO =  -> troque o valor pela data de hoje (AAAA-MM-DD).
               (b) O trecho entre os marcadores  // AGENDA-AUTO-INICIO  e  // AGENDA-AUTO-FIM  -> substitua o
                   array const DATADOS por 6 a 12 eventos reais, no MESMO estilo dos itens que já existem
                   (objetos JavaScript com aspas duplas). Campos de cada item, nesta ordem:
                   n (nome), cat (categoria), data (AAAA-MM-DD), hora (ex 19h), local (Local — bairro),
                   preco (ex R$45 ou Grátis ou Consultar), desc (uma frase curta), link (URL).
                   Mantenha os dois marcadores de comentário no lugar.

            REGRA DO LINK (obrigatória): o campo link deve apontar SEMPRE para o link direto de INGRESSOS
            (Sympla, Shotgun, Eventim ou Pixta) OU, quando o evento for gratuito, para a página EXATA da
            fonte onde a informação foi encontrada (o artigo/post específico do el Cabong, Roda Cultural,
            Roteiro Cultural SSA ou da Prefeitura). NUNCA use link de busca do Google nem a home genérica.

            Outras regras: cat deve ser exatamente um destes seis valores minúsculos — musica, festa,
            teatro, arte, feira, popular. data no formato AAAA-MM-DD, dentro dos próximos 12 dias e do ano
            atual. NUNCA invente eventos (se achar poucos confiáveis, coloque poucos). NÃO use emojis em
            lugar nenhum. NÃO altere o array FIXOS nem nenhuma outra parte do arquivo.

            4) Confira que o index.html continua válido (chaves, colchetes e vírgulas do DATADOS certos).

            5) Publique: faça git add do index.html, git commit com a mensagem
               "chore: atualiza agenda da semana (auto)" e git push na branch main.
               Se não encontrar nenhum evento novo confiável, atualize só a data (HOJE_ISO) e publique
               mesmo assim.
